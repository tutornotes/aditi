<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px) brightness(1.2);
      -webkit-backdrop-filter: blur(18px) brightness(1.2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      color: #000;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.06);
      padding: 35px 25px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }
    h2 {
      margin-bottom: 25px;
      font-size: 26px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
    }
    .seller {
      background: #16a34a;
      color: white;
    }
    .seller:hover {
      background: #15803d;
    }
    .restaurant {
      background: #2563eb;
      color: white;
    }
    .restaurant:hover {
      background: #1e40af;
    }

    @media (max-width: 480px) {
      h2 { font-size: 22px; }
      .btn { font-size: 16px; padding: 14px; }
      .container { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Select Your Portal</h2>
    <button class="btn seller" onclick="location.href='seller_auth.html'">Seller Login</button>
    <button class="btn restaurant" onclick="location.href='restaurant_auth.html'">Restaurant Login</button>
  </div>
</body>
</html>
