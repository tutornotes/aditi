<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Auth (Dev)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body{font-family:Inter, sans-serif;background:#f7fdee} .tab-active{color:#059669;border-bottom:2px solid #059669} </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="bg-white shadow-2xl rounded-2xl p-6 w-full max-w-md">
    <div class="text-center mb-3">
      <h1 class="text-2xl font-bold text-green-700">Vendor Connect</h1>
      <p class="text-sm text-gray-500">Development connection status shown below</p>
    </div>

    <div class="mb-4 text-center">
      <span id="connStatus" class="px-3 py-1 rounded-lg bg-gray-100 text-sm">Checking connection...</span>
    </div>

    <div class="flex border-b border-gray-200 mb-4">
      <button id="tabLogin" class="flex-1 py-2 tab-active" onclick="showTab('login')">Login</button>
      <button id="tabRegister" class="flex-1 py-2 text-gray-600" onclick="showTab('register')">Register</button>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); sellerLogin();" class="space-y-3">
      <input id="loginEmail" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg" />
      <input id="loginPassword" type="password" placeholder="Password" required class="w-full p-3 border rounded-lg" />
      <button class="w-full bg-green-600 text-white py-3 rounded-lg">Sign In</button>
    </form>

    <form id="registerForm" onsubmit="event.preventDefault(); sellerRegister();" class="space-y-3 hidden">
      <input id="regName" placeholder="Shop name" required class="w-full p-3 border rounded-lg" />
      <input id="regEmail" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg" />
      <input id="regPassword" type="password" placeholder="Password (min 6)" minlength="6" required class="w-full p-3 border rounded-lg" />
      <button class="w-full bg-green-600 text-white py-3 rounded-lg">Create account</button>
    </form>

    <p id="message" class="mt-3 text-center text-sm"></p>
  </div>

<script>
const appScriptUrl = 'https://script.google.com/macros/s/AKfycbz6mNlpqXeWbtIsdkPGt_fWqYrAy1hNQqsNR-mINofqwAMimPbbOjLl_N1eIBmFhDQ6Hw/exec'; // replace after deploying code.gs

function updateConnStatus(text, ok=true) {
  const el = document.getElementById('connStatus');
  el.textContent = text;
  el.style.background = ok ? '#ecfdf5' : '#fff1f2'; // greenish / redish
  el.style.color = ok ? '#065f46' : '#991b1b';
}

async function checkConnection() {
  updateConnStatus('Checking connection...', true);
  try {
    const res = await fetch(appScriptUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action: 'checkConnection' })
    });
    const json = await res.json();
    if (json.success) {
      const details = [];
      if (json.usersSheet.created) details.push('Users sheet created');
      if (json.inventorySheet.created) details.push('Inventory sheet created');
      if (json.ordersSheet.created) details.push('Orders sheet created');
      const msg = 'Connected — ' + (details.length ? details.join(', ') : 'Sheets present');
      updateConnStatus(msg, true);
    } else {
      updateConnStatus('Connected but check failed', false);
    }
  } catch (err) {
    updateConnStatus('Connection failed: ' + err.message, false);
  }
}

function showTab(tab) {
  document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  document.getElementById('tabLogin').classList.toggle('tab-active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('tab-active', tab === 'register');
}

function showMessage(msg, err=false) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.style.color = err ? 'crimson' : 'green';
}

async function sellerLogin() {
  showMessage('Signing in...');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  try {
    const res = await fetch(appScriptUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'login', email, password, type:'seller' })
    });
    const json = await res.json();
    if (json.success) {
      localStorage.setItem('sellerEmail', json.user.email);
      showMessage('Login successful. Redirecting...');
      setTimeout(()=> window.location.href = 'seller_dashboard.html', 700);
    } else {
      showMessage(json.message || 'Login failed', true);
    }
  } catch (err) {
    showMessage('Network error: ' + err.message, true);
  }
}

async function sellerRegister() {
  showMessage('Registering...');
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  try {
    const res = await fetch(appScriptUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'register', name, email, password, type:'seller' })
    });
    const json = await res.json();
    if (json.success) {
      showMessage('Registered. Please log in.');
      showTab('login');
    } else {
      showMessage(json.message || 'Registration failed', true);
    }
  } catch (err) {
    showMessage('Network error: ' + err.message, true);
  }
}

// run connection check on load
document.addEventListener('DOMContentLoaded', () => {
  // small delay to let user set appScriptUrl
  setTimeout(checkConnection, 300);
});
</script>
</body>
</html>
