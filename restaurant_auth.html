<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restaurant — Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --accent: #b91c1c;
      --success:#16a34a;
      --danger:#dc2626;
      --muted:#6b7280;
    }
    body{font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,#fff7f7, #fff1f1 60%); min-height:100vh;}
    .glass{background: rgba(255,255,255,0.95); backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(11,15,20,0.06);}
    .active{color:var(--accent); border-bottom:3px solid var(--accent);}
    .input-focus:focus{outline: none; box-shadow: 0 4px 14px rgba(185,28,28,0.12); border-color: rgba(185,28,28,0.65);}
    .banner {position:fixed; left:50%; transform:translateX(-50%); top:18px; z-index:60; max-width:720px; width:calc(100% - 48px); display:flex; gap:12px; align-items:center; padding:10px 14px; border-radius:10px; box-shadow:0 8px 30px rgba(2,6,23,0.08); opacity:0; pointer-events:none; transition:all .28s ease;}
    .banner.show{opacity:1; top:28px; pointer-events:auto;}
    .banner.success{background:linear-gradient(90deg,#ecfdf5,#dcfce7); border:1px solid rgba(16,185,129,0.12); color:var(--success);}
    .banner.error{background:linear-gradient(90deg,#fff1f2,#fee2e2); border:1px solid rgba(220,38,38,0.08); color:var(--danger);}
    .modal-bg {position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(2,6,23,0.45); z-index:50; padding:20px; opacity:0; pointer-events:none; transition:opacity .18s ease;}
    .modal-bg.show{opacity:1; pointer-events:auto;}
    .modal-card{width:100%; max-width:520px; border-radius:12px; overflow:hidden; transform:translateY(8px); transition:transform .18s ease;}
    .btn-primary{background:var(--accent); color:#fff;}
    .btn-ghost{background:transparent; border:1px solid rgba(0,0,0,0.06);}
    @media (max-width:420px){ .glass{padding:18px;} }
  </style>
</head>
<body class="flex items-center justify-center p-6">

  <div id="banner" class="banner" role="status" aria-live="polite"></div>

  <div class="glass rounded-2xl p-8 max-w-md w-full">
    <h1 class="text-2xl font-semibold text-center text-rose-700 mb-4">Restaurant Portal</h1>

    <div id="statusBox" class="text-sm text-center p-2 rounded-md bg-gray-50 text-gray-600 mb-4">Checking connection...</div>

    <div class="flex border-b mb-4">
      <button id="loginTab" class="flex-1 py-2 active text-center" onclick="switchTab('login')">Login</button>
      <button id="registerTab" class="flex-1 py-2 text-center" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" onsubmit="event.preventDefault(); loginRest();" class="space-y-3">
      <input id="loginEmail" type="email" placeholder="Email" required class="w-full p-3 border rounded-lg input-focus" />
      <input id="loginPassword" type="password" placeholder="Password" required class="w-full p-3 border rounded-lg input-focus" />
      <button class="w-full py-3 rounded-lg btn-primary">Login</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" onsubmit="event.preventDefault(); registerRest();" class="space-y-3 hidden">
      <input id="regName" required placeholder="Restaurant Name" class="w-full p-3 border rounded-lg input-focus" />
      <input id="regEmail" type="email" required placeholder="Email" class="w-full p-3 border rounded-lg input-focus" />
      <input id="regPassword" type="password" minlength="5" required placeholder="Password" class="w-full p-3 border rounded-lg input-focus" />
      <button class="w-full py-3 rounded-lg btn-primary">Create Account</button>
    </form>

    <p id="message" class="text-center text-sm mt-4 text-gray-600"></p>
  </div>

  <!-- Quantity / confirm modal -->
  <div id="modalBg" class="modal-bg" aria-hidden="true">
    <div class="modal-card bg-white p-6 rounded-xl">
      <h3 id="modalTitle" class="text-lg font-semibold mb-2">Confirm</h3>
      <p id="modalDesc" class="text-sm text-gray-600 mb-4"></p>
      <div id="modalBody"></div>
      <div class="mt-4 flex justify-end gap-2">
        <button id="modalCancel" class="px-4 py-2 rounded-lg btn-ghost">Cancel</button>
        <button id="modalConfirm" class="px-4 py-2 rounded-lg btn-primary">Confirm</button>
      </div>
    </div>
  </div>

<script>
/* ====== Configuration ====== */
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGnMD2If80YKUEyTgDLVX4hsVwMWXPD6OJt6fy6EzNR1Jpg_2Mz9ImnffGQMXfvMBbNQ/exec';

/* ====== UI helpers ====== */
function showBanner(text, type='success', timeout=3500){
  const b = document.getElementById('banner');
  b.className = 'banner '+(type==='success'?'success':'error')+' show';
  b.innerHTML = `<div class="text-sm font-medium">${text}</div>`;
  if (timeout) setTimeout(()=>{ b.className = 'banner'; }, timeout);
}
function setStatus(txt, ok=true){
  const el=document.getElementById('statusBox'); el.textContent=txt;
  el.style.background = ok ? '#ecfdf5' : '#fff1f2';
  el.style.color = ok ? '#065f46' : '#991b1b';
}
function clearMessage(){ document.getElementById('message').textContent=''; }
function showInlineMessage(txt, err=false){ const el=document.getElementById('message'); el.textContent=txt; el.style.color = err ? 'crimson' : '#065f46'; }

/* ====== Modal ====== */
const modalBg = document.getElementById('modalBg'), modalTitle=document.getElementById('modalTitle'),
      modalDesc=document.getElementById('modalDesc'), modalBody=document.getElementById('modalBody'),
      modalCancel=document.getElementById('modalCancel'), modalConfirm=document.getElementById('modalConfirm');

function openModal({ title='Confirm', desc='', bodyHtml='', onConfirm=null, confirmText='Confirm' }){
  modalTitle.textContent = title;
  modalDesc.textContent = desc;
  modalBody.innerHTML = bodyHtml || '';
  modalConfirm.textContent = confirmText;
  modalBg.classList.add('show');
  modalConfirm.onclick = ()=>{ try{ if(onConfirm) onConfirm(); } catch(e){ console.error(e); } closeModal(); };
  modalCancel.onclick = closeModal;
  modalBg.onclick = (e)=>{ if(e.target===modalBg) closeModal(); };
}
function closeModal(){ modalBg.classList.remove('show'); modalBody.innerHTML=''; modalConfirm.onclick = null; }

/* ====== Backend API helper (simple) ====== */
async function apiGet(params){
  const url = APP_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  const txt = await res.text();
  try { return JSON.parse(txt); } catch(e) { return { success:false, message:'Invalid JSON from backend: '+txt }; }
}

/* ====== Connection check ====== */
async function checkConn(){
  setStatus('Checking connection...');
  try {
    const r = await apiGet({ action:'checkConnection' });
    if(r && r.success) setStatus('Connected to backend', true);
    else setStatus('Connection failed: '+(r.message||'unknown'), false);
  } catch(err){ setStatus('Connection failed: '+err.message, false); }
}

/* ====== Auth actions ====== */
async function registerRest(){
  showInlineMessage('Registering...');
  try {
    const r = await apiGet({ action:'register', name: regName.value.trim(), email: regEmail.value.trim(), password: regPassword.value, type:'restaurant' });
    if (r.success) { showBanner('Registered successfully. Please login.', 'success'); switchTab('login'); } else { showInlineMessage(r.message || 'Registration failed', true); showBanner(r.message || 'Registration failed', 'error'); }
  } catch(err){ showInlineMessage('Network error: '+err.message, true); showBanner('Network error', 'error'); }
}
async function loginRest(){
  showInlineMessage('Logging in...');
  try {
    const r = await apiGet({ action:'login', email: loginEmail.value.trim(), password: loginPassword.value, type:'restaurant' });
    if (r.success) {
      localStorage.setItem('restaurantEmail', r.user.email);
      showBanner('Login successful', 'success');
      // temporary delay so user sees the banner
      setTimeout(()=> location.href='restaurant_dashboard.html', 600);
    } else { showInlineMessage(r.message || 'Login failed', true); showBanner(r.message || 'Login failed', 'error'); }
  } catch(err){ showInlineMessage('Network error: '+err.message, true); showBanner('Network error', 'error'); }
}

/* ====== Tabs ====== */
function switchTab(t){
  document.getElementById('loginForm').classList.toggle('hidden', t!=='login');
  document.getElementById('registerForm').classList.toggle('hidden', t!=='register');
  document.getElementById('loginTab').classList.toggle('active', t==='login');
  document.getElementById('registerTab').classList.toggle('active', t==='register');
  clearMessage();
}

/* ====== DOM loaded ====== */
document.addEventListener('DOMContentLoaded', ()=>{ checkConn(); });

</script>
</body>
</html>
